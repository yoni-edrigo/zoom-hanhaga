    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        overflow-x: hidden;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        position: relative;
        direction: rtl;
        background: url("https://images.unsplash.com/photo-1523580494863-6f3031224c94?w=1920&q=80")
          center/cover no-repeat fixed;
        background-color: #1a1a2e;
      }

      /* Video Background */
      .video-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }

      /* Dark overlay mask */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.75),
          rgba(20, 20, 50, 0.8)
        );
        z-index: 1;
      }

      .container {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 2rem;
        color: white;
      }

      /* Logo Section */
      .logos-header {
        position: relative;
        width: 100%;
        padding: 1.2rem 2rem 1.5rem;
        margin-bottom: 0.5rem;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.55) 0%,
          rgba(10, 10, 30, 0.35) 70%,
          transparent 100%
        );
        z-index: 1000;
      }

      .logos {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
      }

      .logo {
        width: 110px;
        height: 110px;
        background: rgba(229, 229, 233, 0.75);
        border-radius: 18px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(238, 227, 227, 0.18);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.45),
          0 0 0 1px rgba(255, 255, 255, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        overflow: hidden;
        animation: logoFadeIn 0.8s ease both;
      }

      .logo:first-child {
        animation-delay: 0.1s;
      }
      .logo:last-child {
        animation-delay: 0.25s;
      }

      @keyframes logoFadeIn {
        from {
          opacity: 0;
          transform: translateY(-12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo:hover {
        transform: translateY(-4px) scale(1.04);
        box-shadow:
          0 16px 40px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
      }

      .logo-svg {
        filter: brightness(0) invert(1)
          drop-shadow(0 1px 4px rgba(0, 0, 0, 0.6));
      }

      .logo img,
      .logo svg {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      .logo svg path {
        fill: white !important;
      }

      /* Main Content */
      .content {
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
        flex-grow: 1;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 700;
        margin-bottom: 1rem;
        background: linear-gradient(135deg, #fff, #a8daff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 30px rgba(168, 218, 255, 0.3);
        line-height: 1.3;
        text-align: center;
      }

      .subtitle {
        font-size: clamp(1rem, 2.5vw, 1.3rem);
        color: #e0e0e0;
        margin-bottom: 3rem;
        font-weight: 300;
        text-align: center;
      }

      /* Video Section */
      .video-section {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 2rem;
        margin-bottom: 2rem;
      }

      .video-section h2 {
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
        color: #4facfe;
        text-align: center;
      }

      .video-container {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        overflow: hidden;
      }

      .video-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 15px;
      }

      /* PDF Section */
      .pdf-section {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 2rem;
        margin-bottom: 2rem;
      }

      .pdf-section h2 {
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
        color: #4facfe;
        text-align: center;
      }

      .pdf-container {
        width: 100%;
        height: 600px;
        border-radius: 15px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.3);
      }

      .pdf-container iframe {
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 15px;
      }

      .pdf-fallback {
        display: none;
        text-align: center;
        padding: 2rem;
        color: #e0e0e0;
      }

      .pdf-download-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1rem;
        padding: 0.8rem 2rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-decoration: none;
        border-radius: 50px;
        font-size: 1rem;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
      }

      .pdf-download-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.6);
      }

      @media (max-width: 768px) {
        .pdf-container {
          height: 400px;
        }

        .pdf-section {
          padding: 1.5rem;
        }

        .pdf-section h2 {
          font-size: 1.4rem;
          margin-bottom: 1rem;
        }
      }

      @media (max-width: 480px) {
        .pdf-container {
          height: 300px;
        }

        .pdf-section h2 {
          font-size: 1.2rem;
        }
      }

      /* WhatsApp Link */
      .whatsapp-section {
        text-align: center;
        margin-top: 2rem;
        padding: 1.5rem;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 15px;
        margin-bottom: 2rem;
      }

      .whatsapp-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: #fefefe;
        font-size: 1.1rem;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.3s ease;
      }

      .whatsapp-link:hover {
        color: #4facfe;
        transform: translateY(-2px);
      }

      /* Responsive */
      @media (max-width: 768px) {
        .logos-header {
          padding: 1rem 1rem 1.2rem;
        }

        .logo {
          width: 75px;
          height: 75px;
          padding: 0.65rem;
        }

        .container {
          padding: 1rem;
        }

        h1 {
          font-size: 1.8rem;
          margin-bottom: 0.8rem;
        }

        .subtitle {
          font-size: 1rem;
          margin-bottom: 2rem;
        }

        .video-section {
          padding: 1.5rem;
        }

        .video-section h2 {
          font-size: 1.4rem;
          margin-bottom: 1rem;
        }
      }

      @media (max-width: 480px) {
        .logo {
          width: 60px;
          height: 60px;
          padding: 0.5rem;
        }

        h1 {
          font-size: 1.5rem;
          line-height: 1.4;
        }

        .subtitle {
          font-size: 0.95rem;
        }

        .video-section h2 {
          font-size: 1.2rem;
        }
      }
    </style>
